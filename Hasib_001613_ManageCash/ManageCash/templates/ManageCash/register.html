{% extends 'ManageCash/base.html' %}
{% block title %}Create an Account | ManageCash{% endblock %}
{% block content %}
<section class="form-box auth-box">
  <h1>Create an Account</h1>
  <p class="muted">Keep track of your cash in one place.</p>
  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" name="username" id="username" value="{{ request.POST.username }}" maxlength="150" autocomplete="username" required>
    </div>
    <div class="form-group">
      <label for="email">Email <span class="optional">(optional)</span></label>
      <input type="email" name="email" id="email" value="{{ request.POST.email }}" autocomplete="email">
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" name="password" id="password" autocomplete="new-password" required>
    </div>
    <div class="form-group">
      <label for="confirm_password">Confirm Password</label>
      <input type="password" name="confirm_password" id="confirm_password" autocomplete="new-password" required>
    </div>
    <button class="button full-width" type="submit">Register</button>
  </form>
  <p class="form-note">Already have an account? <a href="{% url 'login' %}">Login</a>.</p>
</section>
{% endblock %}
