{% extends 'ManageCash/base.html' %}
{% block title %}Edit Cash Entry | ManageCash{% endblock %}
{% block content %}
<section class="form-box">
  <h1>Edit Cash Entry</h1>
  <p class="muted">Update the details of this income entry.</p>
  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label for="source">Source</label>
      <input type="text" name="source" id="source" value="{{ cash.source }}" maxlength="200" required>
    </div>
    <div class="form-group">
      <label for="amount">Amount</label>
      <input type="number" name="amount" id="amount" value="{{ cash.amount }}" step="0.01" required>
    </div>
    <div class="form-group">
      <label for="description">Description <span class="optional">(optional)</span></label>
      <textarea name="description" id="description" rows="3">{{ cash.description }}</textarea>
    </div>
    <div class="actions">
      <button class="button" type="submit">Save Changes</button>
      <a class="button button-secondary" href="{% url 'dashboard' %}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
