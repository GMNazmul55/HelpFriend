{% extends 'ManageCash/base.html' %}
{% block title %}Login | ManageCash{% endblock %}
{% block content %}
<section class="form-box auth-box">
  <h1>Login</h1>
  <p class="muted">Log in to manage your income and expenses.</p>
  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label for="username">Username or Email</label>
      <input type="text" name="username" id="username" value="{{ request.POST.username }}" autocomplete="username" required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" name="password" id="password" autocomplete="current-password" required>
    </div>
    <button class="button full-width" type="submit">Login</button>
  </form>
  <p class="form-note">New here? <a href="{% url 'register' %}">Create an account</a>.</p>
</section>
{% endblock %}
