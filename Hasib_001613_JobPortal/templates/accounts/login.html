{% extends "base.html" %}
{% block title %}Login | Hasib_001613_JobPortal{% endblock %}
{% block content %}
<section class="form-box auth-box"><p class="eyebrow">Welcome back</p><h1>Login</h1><p class="muted">Sign in to your Hasib_001613_JobPortal workspace.</p><form method="post">{% csrf_token %}
<div class="form-group"><label for="username">Username</label><input type="text" name="username" id="username" value="{{ request.POST.username }}" autocomplete="username" required></div>
<div class="form-group"><label for="password">Password</label><input type="password" name="password" id="password" autocomplete="current-password" required></div>
<button class="button full-width" type="submit">Login</button></form><p class="form-note">New here? <a href="{% url 'register' %}">Create an account</a>.</p></section>
{% endblock %}
